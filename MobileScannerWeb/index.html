<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MacToys Mobile Scanner</title>
    <!-- Use specific stable versions -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #111; color: #fff; font-family: -apple-system, system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #header { padding: 16px; text-align: center; background-color: #000; font-weight: bold; font-size: 18px; z-index: 10; border-bottom: 1px solid #333; }
        #reader-container { flex: 1; width: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000; overflow: hidden; }
        #reader { width: 100%; max-width: 500px; }
        
        #status-bar { padding: 12px; text-align: center; background-color: #c0392b; font-size: 14px; z-index: 10; word-wrap: break-word; font-weight: bold; }
        #status-bar.connected { background-color: #27ae60; }
        #status-bar.warning { background-color: #f39c12; }
        
        .success-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(39, 174, 96, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .success-overlay.show { opacity: 1; pointer-events: all; }
        .success-icon { font-size: 80px; margin-bottom: 16px; }
        
        /* Style the built-in scanner UI to look good on dark mode */
        #reader button { padding: 12px 24px; font-size: 16px; background-color: #3498db; color: white; border: none; border-radius: 8px; margin: 10px; font-weight: bold; }
        #reader select { padding: 10px; font-size: 16px; margin: 10px; max-width: 90%; }
        #reader a { color: #3498db; }
        #reader__dashboard_section_swaplink { display: none !important; }
    </style>
</head>
<body>
    <div id="header">MacToys Scanner</div>
    <div id="reader-container">
        <div id="reader"></div>
    </div>
    <div id="status-bar">Waiting for WebRTC connection...</div>
    
    <div id="success-overlay" class="success-overlay">
        <div class="success-icon">✓</div>
        <h2>Sent to Mac!</h2>
    </div>

    <script>
        const statusEl = document.getElementById('status-bar');
        const overlayEl = document.getElementById('success-overlay');
        
        function setStatus(msg, state = '') {
            statusEl.textContent = msg;
            statusEl.className = state;
            console.log("STATUS:", msg);
        }

        // 1. Initialize WebRTC in the background immediately
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        let dataConnection = null;

        if (roomId) {
            try {
                const peer = new Peer();
                peer.on('open', (id) => {
                    setStatus('Connecting to Mac...', 'warning');
                    dataConnection = peer.connect(roomId, { reliable: true });
                    
                    dataConnection.on('open', () => {
                        setStatus('Connected to Mac! Ready to scan.', 'connected');
                    });
                    
                    dataConnection.on('close', () => {
                        setStatus('Disconnected from Mac.', 'error');
                    });
                    
                    dataConnection.on('error', (err) => {
                        setStatus('Mac Connection Error: ' + err, 'error');
                    });
                });
                peer.on('error', (err) => {
                    setStatus('Network Error: ' + err.type, 'error');
                });
            } catch (e) {
                setStatus('WebRTC Error: ' + e.message, 'error');
            }
        } else {
            setStatus('Error: No Room ID found in URL.', 'error');
        }

        // 2. Initialize Camera UI immediately (using the robust built-in UI)
        let isProcessing = false;
        
        try {
            // Html5QrcodeScanner provides its own "Request Camera" button and handles all browser quirks
            const html5QrcodeScanner = new Html5QrcodeScanner(
                "reader",
                { fps: 10, qrbox: { width: 250, height: 250 }, rememberLastUsedCamera: true },
                /* verbose= */ false
            );
            
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        } catch (e) {
            document.getElementById('reader').innerHTML = '<div style="color:red; padding:20px;">Camera Init Error: ' + e.message + '</div>';
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return;
            
            if (!dataConnection || !dataConnection.open) {
                alert("Cannot send: Not connected to Mac yet!");
                return;
            }
            
            isProcessing = true;
            
            // Send payload to Mac
            dataConnection.send({ type: 'scan', payload: decodedText });
            
            // Show Success UI
            overlayEl.classList.add('show');
            if (navigator.vibrate) navigator.vibrate(200);
            
            // Hide after 2 seconds
            setTimeout(() => {
                overlayEl.classList.remove('show');
                isProcessing = false;
            }, 2000);
        }

        function onScanFailure(error) {
            // This fires constantly while scanning, ignore it
        }
    </script>
</body>
</html>
