name: MacToys
options:
  bundleIdPrefix: com.mactoys
  deploymentTarget:
    macOS: 15.0

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0

targets:
  MacToysKit:
    type: framework
    platform: macOS
    sources:
      - path: Sources/MacToysKit
    dependencies:
      - package: KeyboardShortcuts
    settings:
      SWIFT_VERSION: 6.0
      GENERATE_INFOPLIST_FILE: YES
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 1.0.0
      
  MacToys:
    type: application
    platform: macOS
    sources:
      - path: Sources/MacToys
    dependencies:
      - target: MacToysKit
    settings:
      SWIFT_VERSION: 6.0
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_LSUIElement: YES
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 1.0.0
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_IDENTITY: "-" # Ad-hoc signing
      CODE_SIGN_STYLE: Manual

  MacToysTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MacToysTests
    dependencies:
      - target: MacToys
      - target: MacToysKit
